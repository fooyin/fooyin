name: Build

on:
  workflow_call:
    inputs:
      version_suffix:
        description: Optional suffix appended to the application and package version
        required: false
        type: string
        default: ''
  push:
    branches-ignore:
      - update-translations
    paths-ignore:
      - '*.md'
      - 'data/translations/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - 'data/translations/**'
  release:
    types: [published]

permissions:
  contents: write # needed for vcpkg cache and release upload

jobs:
  linux:
    name: Build Linux
    uses: ./.github/workflows/build-linux.yml
    with:
      version_suffix: ${{ inputs.version_suffix || '' }}
    secrets: inherit

  freebsd:
    name: Build FreeBSD
    uses: ./.github/workflows/build-freebsd.yml
    with:
      version_suffix: ${{ inputs.version_suffix || '' }}
    secrets: inherit

  windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml
    with:
      version_suffix: ${{ inputs.version_suffix || '' }}
    secrets: inherit

  macos:
    name: Build macOS
    uses: ./.github/workflows/build-macos.yml
    with:
      version_suffix: ${{ inputs.version_suffix || '' }}
    secrets: inherit

  flatpak:
    name: Build Flatpak
    uses: ./.github/workflows/build-flatpak.yml
    with:
      version_suffix: ${{ inputs.version_suffix || '' }}
    secrets: inherit

  appimage:
    name: Build AppImage
    uses: ./.github/workflows/build-appimage.yml
    with:
      version_suffix: ${{ inputs.version_suffix || '' }}
    secrets: inherit

  attach:
    name: Attach to release
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs:
      - linux
      - freebsd
      - windows
      - flatpak
      - appimage
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Fedora artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fedora-*
          path: ./artifacts
          merge-multiple: true

      - name: Download Debian artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: debian-*
          path: ./artifacts
          merge-multiple: true

      - name: Download Ubuntu artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ubuntu-*
          path: ./artifacts
          merge-multiple: true

      - name: Download FreeBSD artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: freebsd-*
          path: ./artifacts
          merge-multiple: true

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: ./artifacts
          merge-multiple: true

      - name: Download Flatpak artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: flatpak-*
          path: ./artifacts
          merge-multiple: true

      - name: Download AppImage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          path: ./artifacts
          merge-multiple: true

      - name: Check artifact files
        run: ls -R ./artifacts

      - name: Upload artifacts to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          file: ./artifacts/*
          overwrite: true
          file_glob: true
