name: Publish nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-nightly
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare nightly build
    if: github.repository == 'fooyin/fooyin'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
    steps:
      - name: Set nightly version suffix
        id: version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:8}"
          {
            echo "short_sha=${short_sha}"
            echo "version_suffix=.g${short_sha}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build nightly artifacts
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version_suffix: ${{ needs.prepare.outputs.version_suffix }}
    secrets: inherit

  publish:
    name: Publish nightly build
    if: github.repository == 'fooyin/fooyin'
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nightly configuration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Generate release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          CI_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          date="$(date -u +'%Y-%m-%d')"
          short_sha="$SHORT_SHA"
          tag="nightly-${date}-${short_sha}"
          version="$(awk '$1 == "VERSION" { print $2; exit }' CMakeLists.txt)"
          nightly_version="${version}.g${short_sha}"
          latest_release_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"

          if [[ -z "$version" || -z "$latest_release_tag" ]]; then
            echo "Unable to determine the fooyin or latest release version" >&2
            exit 1
          fi

          sed \
            -e "s|LATEST_RELEASE_TAG|${latest_release_tag}|g" \
            -e "s|RELEASE_TAG|${tag}|g" \
            -e "s|FOOYIN_VERSION|${nightly_version}|g" \
            -e "s|COMMIT_SHA|${BUILD_SHA}|g" \
            -e "s|SHORT_SHA|${short_sha}|g" \
            -e "s|CI_BUILD_DATE|${date}|g" \
            -e "s|CI_RUN_ID|${CI_RUN_ID}|g" \
            .github/ci-nightly-body.md > ci-nightly-body.md

          {
            echo "tag=${tag}"
            echo "name=Nightly build ${date} (${short_sha})"
            echo "version=${version}"
            echo "nightly_version=${nightly_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Ensure package filenames include commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NIGHTLY_VERSION: ${{ steps.release.outputs.nightly_version }}
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            directory="$(dirname "$file")"
            filename="$(basename "$file")"

            if [[ "$filename" == *"$NIGHTLY_VERSION"* ]]; then
              continue
            elif [[ "$filename" == *"$VERSION"* ]]; then
              nightly_filename="${filename/"$VERSION"/"$NIGHTLY_VERSION"}"
            elif [[ "$filename" == fooyin-* ]]; then
              nightly_filename="fooyin-${NIGHTLY_VERSION}-${filename#fooyin-}"
            else
              echo "Cannot add nightly version to unexpected artifact: $filename" >&2
              exit 1
            fi

            mv -- "$file" "$directory/$nightly_filename"
          done < <(find artifacts -type f -print0)

      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: ci-nightly-body.md
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.flatpak
            artifacts/**/*.AppImage

      - name: Remove older nightly pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true) | .tag_name | select(startswith("nightly-"))' |
            while IFS= read -r tag; do
              if [[ "$tag" != "$CURRENT_TAG" ]]; then
                echo "Deleting old nightly pre-release: $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              fi
            done
