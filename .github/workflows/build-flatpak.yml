name: Build Flatpak

on:
  workflow_call:
    inputs:
      version_suffix:
        required: false
        type: string
        default: ''

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Flatpak cache key
        id: flatpak-cache
        shell: bash
        run: echo "key=${{ hashFiles('dist/linux/flatpak/**') }}" >> "$GITHUB_OUTPUT"

      - name: Set bundle name
        id: flatpak-bundle
        env:
          FOOYIN_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        shell: bash
        run: |
          version="$(awk '$1 == "VERSION" { print $2; exit }' CMakeLists.txt)${FOOYIN_VERSION_SUFFIX}"
          echo "name=fooyin-${version}-${{ matrix.arch }}.flatpak" >> "$GITHUB_OUTPUT"

      - name: Set version suffix
        if: inputs.version_suffix != ''
        env:
          FOOYIN_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        shell: bash
        run: |
          sed -i "/- -DBUILD_PCH=ON/a\\      - -DFOOYIN_VERSION_SUFFIX=${FOOYIN_VERSION_SUFFIX}" \
            dist/linux/flatpak/org.fooyin.fooyin.yaml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ steps.flatpak-bundle.outputs.name }}
          manifest-path: dist/linux/flatpak/org.fooyin.fooyin.yaml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ steps.flatpak-cache.outputs.key }}
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ steps.flatpak-bundle.outputs.name }}
