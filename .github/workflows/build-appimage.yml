name: Build AppImage

on:
  workflow_call:
    inputs:
      version_suffix:
        required: false
        type: string
        default: ''
      update_channel:
        description: GitHub release channel used for AppImage updates
        required: false
        type: string
        default: latest

env:
  FOOYIN_VERSION_SUFFIX: ${{ inputs.version_suffix }}
  FOOYIN_APPIMAGE_UPDATE_CHANNEL: ${{ inputs.update_channel }}
  BUILD_CCACHE: ON
  BUILD_PCH: ON
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - name: Prepare AppImage tools
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd # v6
        env:
          QUICK_SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/87f1a9c11c73f23e46a0e7ecd2467d40aaaf0392/useful-tools/quick-sharun.sh
          DEBLOATED_PACKAGES: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/87f1a9c11c73f23e46a0e7ecd2467d40aaaf0392/useful-tools/get-debloated-pkgs.sh

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          ./ci/appimage-depends.sh

      - name: Set ccache generation
        id: ccache-generation
        run: echo "period=$(( $(date -u +%s) / 86400 ))" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: appimage-archlinux-${{ matrix.arch }}-ccache-${{ steps.ccache-generation.outputs.period }}
          restore-keys: |
            appimage-archlinux-${{ matrix.arch }}-ccache-

      - name: Build AppImage
        run: |
          ./ci/appimage-build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            build-appimage/output/*.AppImage
            build-appimage/output/*.AppImage.zsync
          compression-level: 0
          if-no-files-found: error

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
