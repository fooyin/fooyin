name: Build Windows

on:
  workflow_call:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'
  VCPKG_DISABLE_METRICS: true
  VCPKG_ROOT_DIR: 'C:/vcpkg'
  VCPKG_INSTALLED_DIR: 'C:/v'
  VCPKG_DOWNLOADS: 'C:/v/dl'
  BUILD_CCACHE: OFF
  BUILD_PCH: ON
  BUILD_TESTS: ON

jobs:
  windows:
    name: Windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            qt-arch: win64_msvc2022_64
            msvc-arch: amd64
            triplet: x64-windows
            cmake-preset: release-vcpkg
          - arch: arm64
            runner: windows-11-arm
            qt-arch: win64_msvc2022_arm64
            msvc-arch: arm64
            triplet: arm64-windows
            cmake-preset: release-vcpkg-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up build paths
        shell: pwsh
        run: |
          subst S: "$env:GITHUB_WORKSPACE"
          $vcpkgCommit = (Get-Content "$env:GITHUB_WORKSPACE/vcpkg.json" | ConvertFrom-Json).'builtin-baseline'
          git init $env:VCPKG_ROOT_DIR
          git -C $env:VCPKG_ROOT_DIR remote add origin https://github.com/microsoft/vcpkg.git
          git -C $env:VCPKG_ROOT_DIR fetch --depth 1 origin $vcpkgCommit
          git -C $env:VCPKG_ROOT_DIR checkout --detach FETCH_HEAD
          & "$env:VCPKG_ROOT_DIR/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: choco install ninja nsis -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtsvg qttools
          cache: true
          arch: ${{ matrix.qt-arch }}
          install-deps: 'true'

      - name: Setup MSVC Environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Setup vcpkg cache
        shell: pwsh
        run: |
          $cacheDir = "S:/vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cacheDir
          echo "VCPKG_BINARY_SOURCES=clear;files,$cacheDir,readwrite" >> $env:GITHUB_ENV
          echo "VCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" >> $env:GITHUB_ENV

      - name: Cache vcpkg
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/vcpkg-binary-cache
            ${{ env.VCPKG_INSTALLED_DIR }}
          key: ${{ runner.os }}-vcpkg-${{ matrix.cmake-preset }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ matrix.cmake-preset }}-
            ${{ runner.os }}-vcpkg-

      - name: Set CMAKE_PRESET
        shell: pwsh
        run: echo "CMAKE_PRESET=${{ matrix.cmake-preset }}" >> $env:GITHUB_ENV

      - name: Build & Package
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT_DIR }}
        run: |
          Set-Location S:/
          .\ci\windows-build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup-${{ matrix.arch }}
          path: artifacts/*.exe

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable-${{ matrix.arch }}
          path: artifacts/*.zip
