name: Build macOS

on:
  workflow_call:
    inputs:
      version_suffix:
        required: false
        type: string
        default: ''

env:
  FOOYIN_VERSION_SUFFIX: ${{ inputs.version_suffix }}
  BUILD_TESTS: ON
  BUILD_CCACHE: ON
  BUILD_PCH: OFF
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content

jobs:
  macOS:
    name: macOS-${{ matrix.arch }}
    strategy:
      matrix:
        include:
#          - arch: amd64
#            runs-on: macos-15-intel
          - arch: aarch64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Dependencies
        run: |
          ./ci/macos-depends.sh

      - name: Set ccache generation
        id: ccache-generation
        run: echo "period=$(( $(date -u +%s) / 86400 ))" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-${{ matrix.runs-on }}-${{ matrix.arch }}-ccache-${{ steps.ccache-generation.outputs.period }}
          restore-keys: |
            macos-${{ matrix.runs-on }}-${{ matrix.arch }}-ccache-

      - name: Build
        run: |
          ./ci/macos-build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dmg

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
