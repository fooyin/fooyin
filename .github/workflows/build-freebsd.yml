name: Build FreeBSD

on:
  workflow_call:
    inputs:
      version_suffix:
        required: false
        type: string
        default: ''

env:
  FOOYIN_VERSION_SUFFIX: ${{ inputs.version_suffix }}
  BUILD_TESTS: ON
  BUILD_CCACHE: ON
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  freebsd:
    name: FreeBSD
    runs-on: ubuntu-latest
    env:
      FREEBSD_VERSION: '15.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set ccache generation
        id: ccache-generation
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: freebsd-${{ env.FREEBSD_VERSION }}-ccache-${{ steps.ccache-generation.outputs.week }}
          restore-keys: |
            freebsd-${{ env.FREEBSD_VERSION }}-ccache-

      - name: Start FreeBSD VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: freebsd
          architecture: x86-64
          cpu_count: 4
          shell: bash
          version: ${{ env.FREEBSD_VERSION }}
          environment_variables: BUILD_TESTS BUILD_CCACHE FOOYIN_VERSION_SUFFIX CCACHE_DIR CCACHE_BASEDIR CCACHE_MAXSIZE CCACHE_COMPILERCHECK CCACHE_SLOPPINESS

      - name: Build and test
        shell: cpa.sh {0}
        run: |
          ./ci/freebsd-depends.sh
          ./ci/freebsd-build.sh
          if [ "$BUILD_TESTS" = "ON" ]; then
            ./ci/tests.sh
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ env.FREEBSD_VERSION }}
          path: pkg

      - name: Save ccache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
